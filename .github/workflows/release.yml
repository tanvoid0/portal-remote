name: Release

# Tag a commit to ship it:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: ./publish.ps1 -Output ${{ github.workspace }}/out
        shell: pwsh
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: out/PortalRemote.exe

  android:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env:` block is not visible to that
    # step's `if:`, and the secrets context is not available in `if:` at all.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        # Optional: without the secrets the release APK is signed with the debug
        # key, which installs fine but is not an upgrade path for shipped installs.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease --console=plain \
            -PversionName="${VERSION:-0.1.0}" -PversionCode="${GITHUB_RUN_NUMBER}"
          mv app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/PortalRemote-${VERSION:-dev}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/PortalRemote-*.apk

  release:
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        # workflow_dispatch has no tag to release against — it just leaves the
        # build artifacts on the run.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/server/PortalRemote.exe dist/android/*.apk
