name: Release

# Tag a commit to ship it:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  server:
    runs-on: windows-latest
    # Job level for the same reason as the android job: a step's `if:` cannot see that
    # step's own `env:`, and cannot see `secrets` at all.
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        # The tag without its v is the version the tray reports and compares when it
        # checks for updates; a dispatch build with no tag keeps the csproj default.
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.1.0-dev' }
          ./publish.ps1 -Output ${{ github.workspace }}/out -Version $version
        shell: pwsh
        working-directory: server
      - name: Sign the exe
        # Optional, exactly like the Android keystore below: without the secrets the
        # build ships unsigned and Windows shows "unknown publisher" on first run.
        #
        # WINDOWS_CERT_BASE64 is a base64 .pfx. That form only exists for a cert whose
        # private key is exportable — since June 2023 a newly issued OV/EV code-signing
        # key must live on a hardware token or a cloud HSM, so a fresh cert wants the
        # provider's own action here (Azure Trusted Signing, SignPath) in place of
        # signtool. The gate is what matters; swapping the tool inside it is one edit.
        #
        # Timestamped so signatures outlive the cert's expiry.
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object FullName -like '*\x64\*' | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "${{ github.workspace }}/out/PortalRemote.exe"
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed.' }
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: out/PortalRemote.exe

  android:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env:` block is not visible to that
    # step's `if:`, and the secrets context is not available in `if:` at all.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        # Optional: without the secrets the release APK is signed with the debug
        # key, which installs fine but is not an upgrade path for shipped installs.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        run: |
          # A dispatch build has no tag, only a branch name — stamping that as the
          # version would have the phone compare "main" against a release. It reports
          # itself as a dev build instead, same as the server job above.
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="0.1.0-dev" ;;
          esac
          ./gradlew assembleRelease --console=plain \
            -PversionName="$VERSION" -PversionCode="${GITHUB_RUN_NUMBER}"
          mv app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/PortalRemote-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/PortalRemote-*.apk

  release:
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        # workflow_dispatch has no tag to release against — it just leaves the
        # build artifacts on the run.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Until the exe is signed, the checksum is the only way for someone who
          # clicked past the SmartScreen prompt to tell a real download from a proxied
          # one. Flattened out of the per-artifact folders first so the names in the
          # file are the names on disk after downloading, and `sha256sum -c` just works.
          mkdir rel
          find dist -type f \( -name '*.exe' -o -name '*.apk' \) -exec mv -t rel {} +
          (cd rel && sha256sum *) > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            rel/* SHA256SUMS.txt
